name: Bot Utility Commands

on:
  repository_dispatch:
    types: [bot_command]

jobs:
  run_command:
    runs-on: ubuntu-latest

    steps:
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          mkdir -p ~/.config/rclone

          printf '%s' "$RCLONE_CONF_B64" \
            | base64 -d \
            > ~/.config/rclone/rclone.conf

          chmod 600 ~/.config/rclone/rclone.conf

          echo "Remotes configurés :"
          rclone listremotes

          echo "Test Google Drive..."
          rclone about gdrive_bot:

          echo "Test MEGA..."
          rclone about mega_bot:

          echo "Test Union..."
          rclone about cloud:

      - name: Execute command
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          COMMAND: ${{ github.event.client_payload.command }}
        run: |
          send() {
            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$1" \
              > /dev/null
          }

          format_storage() {
            REMOTE="$1"
            LABEL="$2"

            INFO=$(rclone about "$REMOTE:" --json 2>/dev/null)

            if [ -z "$INFO" ]; then
              printf "❌ %s : impossible de récupérer les informations\n" "$LABEL"
              return
            fi

            TOTAL=$(echo "$INFO" | python3 -c \
              "import json,sys; print(json.load(sys.stdin).get('total',0))")

            USED=$(echo "$INFO" | python3 -c \
              "import json,sys; print(json.load(sys.stdin).get('used',0))")

            FREE=$(echo "$INFO" | python3 -c \
              "import json,sys; print(json.load(sys.stdin).get('free',0))")

            TOTAL_GB=$(python3 -c \
              "print(round($TOTAL / 1024**3, 2))")

            USED_GB=$(python3 -c \
              "print(round($USED / 1024**3, 2))")

            FREE_GB=$(python3 -c \
              "print(round($FREE / 1024**3, 2))")

            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$(python3 -c \
                "print(round($USED / $TOTAL * 100, 1))")
            else
              PERCENT="0"
            fi

            printf "📦 %s\nUtilisé : %s Go / %s Go (%s%%)\nLibre : %s Go\n\n" \
              "$LABEL" \
              "$USED_GB" \
              "$TOTAL_GB" \
              "$PERCENT" \
              "$FREE_GB"
          }

          case "$COMMAND" in

            status)

              MSG="💾 ÉTAT DU STOCKAGE\n\n"

              STORAGE_MEGA=$(format_storage "mega_bot" "MEGA")
              STORAGE_GOOGLE=$(format_storage "gdrive_bot" "Google Drive")
              STORAGE_UNION=$(format_storage "cloud" "UNION")

              MSG="${MSG}${STORAGE_MEGA}"
              MSG="${MSG}${STORAGE_GOOGLE}"
              MSG="${MSG}☁️ Vue globale\n${STORAGE_UNION}"

              send "$MSG"
              ;;

            folders)

              LIST=$(rclone lsf cloud: --dirs-only 2>/dev/null)

              if [ -z "$LIST" ]; then
                send "📁 Aucun dossier trouvé sur le stockage."
              else
                FORMATTED=$(echo "$LIST" \
                  | sed 's/\/$//' \
                  | sed 's/^/• /')

                MSG=$(printf \
                  "📁 Dossiers existants :\n\n%s" \
                  "$FORMATTED")

                send "$MSG"
              fi
              ;;

            *)

              send "⚠️ Commande inconnue."

              ;;

          esac