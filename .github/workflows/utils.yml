name: Bot Utility Commands
on:
  repository_dispatch:
    types: [bot_command]

jobs:
  run_command:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Execute command
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          COMMAND: ${{ github.event.client_payload.command }}
        run: |
          send() {
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" -d text="$1" > /dev/null
          }

          case "$COMMAND" in
            status)
              INFO=$(rclone about mega_bot: --json)
              TOTAL=$(echo "$INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])")
              USED=$(echo "$INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['used'])")
              FREE=$(echo "$INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['free'])")
              TOTAL_GB=$(python3 -c "print(round($TOTAL / 1024**3, 2))")
              USED_GB=$(python3 -c "print(round($USED / 1024**3, 2))")
              FREE_GB=$(python3 -c "print(round($FREE / 1024**3, 2))")
              PERCENT=$(python3 -c "print(round($USED / $TOTAL * 100, 1))")
              MSG=$(printf "💾 Stockage Mega\nUtilisé : %s Go / %s Go (%s%%)\nLibre : %s Go" "$USED_GB" "$TOTAL_GB" "$PERCENT" "$FREE_GB")
              send "$MSG"
              ;;
            folders)
              LIST=$(rclone lsf mega_bot: --dirs-only 2>/dev/null)
              if [ -z "$LIST" ]; then
                send "📁 Aucun dossier trouvé sur le stockage."
              else
                FORMATTED=$(echo "$LIST" | sed 's/\/$//' | sed 's/^/• /')
                MSG=$(printf "📁 Dossiers existants :\n%s" "$FORMATTED")
                send "$MSG"
              fi
              ;;
            *)
              send "⚠️ Commande inconnue."
              ;;
          esac