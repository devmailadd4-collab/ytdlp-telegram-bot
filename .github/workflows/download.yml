name: Download and Upload
on:
  repository_dispatch:
    types: [new_download]

jobs:
  download:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url: ${{ fromJSON(toJSON(github.event.client_payload.urls)) }}
      max-parallel: 2
      fail-fast: false
    steps:
      - name: Install tools
        run: |
          pip install -U yt-dlp
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
          
      - name: Install deno
        run: curl -fsSL https://deno.land/install.sh | sh -s -- -y

      - name: Download
        run: yt-dlp -o "%(title)s.%(ext)s" "${{ matrix.url }}"

      - name: Upload
        run: rclone move . gdrive:Videos --include "*.mp4" --include "*.webm" --include "*.mkv"