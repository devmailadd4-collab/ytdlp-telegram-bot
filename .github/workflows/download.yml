name: Download and Upload
on:
  repository_dispatch:
    types: [new_download]

jobs:
  download:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url: ${{ fromJSON(toJSON(github.event.client_payload.urls)) }}
      max-parallel: 2
      fail-fast: false

    steps:
      - name: Install tools
        run: |
          pip install -U "yt-dlp[default,curl-cffi]"
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Install deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Configure cookies
        run: echo "${{ secrets.YT_COOKIES }}" > /tmp/youtube-cookies.txt

      - name: Restore archive cache
        uses: actions/cache/restore@v4
        with:
          path: archive.txt
          key: yt-dlp-archive-
          restore-keys: yt-dlp-archive-

      - name: Download
        id: download
        env:
          RAW_URL: ${{ matrix.url }}
        run: |
          # --- Sanitization défensive de l'URL ---
          URL="$(printf '%s' "$RAW_URL" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          if printf '%s' "$URL" | grep -qE '^\[https?://.*\]\(https?://.*\)$'; then
            URL="$(printf '%s' "$URL" | sed -E 's/^\[[^]]*\]\((https?:\/\/[^)]*)\).*/\1/')"
          fi

          URL="$(printf '%s' "$URL" | sed \
            -e 's/\\_/_/g' \
            -e 's/\\-/-/g' \
            -e 's/\\\*/*/g' \
            -e 's/\\(/(/g' \
            -e 's/\\)/)/g' \
            -e 's/\\\[/[/g' \
            -e 's/\\]/]/g')"

          echo "URL brute    : $RAW_URL"
          echo "URL nettoyée : $URL"

          if [[ ! "$URL" =~ ^https?:// ]]; then
            echo "ERREUR : URL invalide après sanitization, abandon"
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "$RAW_URL" > failed_url.txt
            exit 0
          fi

          touch archive.txt

          COMMON_FLAGS=(
            --js-runtimes deno
            --impersonate chrome
            -f "bestvideo[height<=480]+bestaudio/best"
            --download-archive archive.txt
            --retries 10
            --fragment-retries 10
            -c
            -o "%(title)s.%(ext)s"
          )

          echo "Tentative 1/3 : sans cookies, avec impersonation Chrome"
          if yt-dlp "${COMMON_FLAGS[@]}" "$URL"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Tentative 2/3 : avec cookies, avec impersonation Chrome"
          if yt-dlp --cookies /tmp/youtube-cookies.txt "${COMMON_FLAGS[@]}" "$URL"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Tentative 3/3 : diagnostic verbose (pour comprendre l'échec, pas de retéléchargement)"
          yt-dlp -v -F --impersonate chrome --js-runtimes deno "$URL" 2>&1 | tail -n 40 || true

          echo "Échec des trois tentatives"
          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "$URL" > failed_url.txt

      - name: Save archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive.txt
          key: yt-dlp-archive-${{ github.run_id }}

      - name: Upload failed URL as artifact
        if: steps.download.outputs.success == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: failed-url-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: failed_url.txt
          retention-days: 1

      - name: Create folder if needed
        if: steps.download.outputs.success == 'true'
        run: rclone mkdir "mega_bot:${{ github.event.client_payload.folder }}"

      - name: Upload
        if: steps.download.outputs.success == 'true'
        run: |
          rclone move . "mega_bot:${{ github.event.client_payload.folder }}" \
            --include "*.mp4" --include "*.webm" --include "*.mkv"

  notify_batch_done:
    needs: download
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download failed URL artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: failed-url-*
          path: failed_urls
          merge-multiple: true

      - name: Build summary and notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          FOLDER="${{ github.event.client_payload.folder }}"
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          COUNT=$(echo '${{ toJSON(github.event.client_payload.urls) }}' | jq 'length')

          if [ -d failed_urls ] && [ "$(ls -A failed_urls 2>/dev/null)" ]; then
            cat failed_urls/*.txt > failed_links.txt 2>/dev/null || true
            FAIL_COUNT=$(wc -l < failed_links.txt | tr -d ' ')
          else
            FAIL_COUNT=0
          fi

          if [ "$FAIL_COUNT" -eq 0 ]; then
            TEXT="✅ Lot terminé — $COUNT lien(s) traité(s) avec succès dans le dossier \"$FOLDER\"."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$TEXT"
          else
            SUCCESS_COUNT=$((COUNT - FAIL_COUNT))
            TEXT="⚠️ Lot terminé — $SUCCESS_COUNT/$COUNT lien(s) réussis dans \"$FOLDER\". $FAIL_COUNT échec(s), liste jointe."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$TEXT"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@failed_links.txt
          fi