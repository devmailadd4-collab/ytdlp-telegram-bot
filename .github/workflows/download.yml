name: Download and Upload
on:
  repository_dispatch:
    types: [new_download]

jobs:
  download:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url: ${{ fromJSON(toJSON(github.event.client_payload.urls)) }}
      max-parallel: 2
      fail-fast: false

    steps:
      - name: Install tools
        run: |
          pip install -U "yt-dlp[default,curl-cffi]"
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Install deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Configure cookies
        run: echo "${{ secrets.YT_COOKIES }}" > /tmp/youtube-cookies.txt

      - name: Restore archive cache
        uses: actions/cache/restore@v4
        with:
          path: archive.txt
          key: yt-dlp-archive-
          restore-keys: yt-dlp-archive-

      - name: Download
        id: download
        env:
          RAW_URL: ${{ matrix.url }}
        run: |
          # --- Sanitization défensive de l'URL ---
          URL="$(printf '%s' "$RAW_URL" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          # Si l'URL arrive sous forme Markdown [texte](url), extraire l'url réelle
          if printf '%s' "$URL" | grep -qE '^\[https?://.*\]\(https?://.*\)$'; then
            URL="$(printf '%s' "$URL" | sed -E 's/^\[[^]]*\]\((https?:\/\/[^)]*)\).*/\1/')"
          fi

          # Désescape des caractères Markdown courants (remplacements explicites, pas de classe regex fragile)
          URL="$(printf '%s' "$URL" | sed \
            -e 's/\\_/_/g' \
            -e 's/\\-/-/g' \
            -e 's/\\\*/*/g' \
            -e 's/\\(/(/g' \
            -e 's/\\)/)/g' \
            -e 's/\\\[/[/g' \
            -e 's/\\]/]/g')"

          echo "URL brute    : $RAW_URL"
          echo "URL nettoyée : $URL"
          if [ "$RAW_URL" != "$URL" ]; then
            echo "⚠️ L'URL a été modifiée par la sanitization"
          fi

          if [[ ! "$URL" =~ ^https?:// ]]; then
            echo "ERREUR : URL invalide après sanitization, abandon"
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          touch archive.txt

          COMMON_FLAGS=(
            --js-runtimes deno
            --impersonate chrome
            -f "bestvideo[height<=480]+bestaudio/best"
            --download-archive archive.txt
            --retries 10
            --fragment-retries 10
            -c
            -o "%(title)s.%(ext)s"
          )

          echo "Tentative 1/3 : sans cookies, avec impersonation Chrome"
          if yt-dlp "${COMMON_FLAGS[@]}" "$URL"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Tentative 2/3 : avec cookies, avec impersonation Chrome"
          if yt-dlp --cookies /tmp/youtube-cookies.txt "${COMMON_FLAGS[@]}" "$URL"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Tentative 3/3 : diagnostic verbose (pour comprendre l'échec, pas de retéléchargement)"
          yt-dlp -v -F --impersonate chrome --js-runtimes deno "$URL" 2>&1 | tail -n 40 || true

          echo "Échec des trois tentatives"
          echo "success=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Save archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive.txt
          key: yt-dlp-archive-${{ github.run_id }}

      - name: Notify failure
        if: steps.download.outputs.success == 'false'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ github.event.client_payload.chat_id }}" \
            -d text="❌ Échec du téléchargement (sans cookies, avec cookies, avec impersonation) : ${{ matrix.url }}"

      - name: Create folder if needed
        if: steps.download.outputs.success == 'true'
        run: rclone mkdir "mega_bot:${{ github.event.client_payload.folder }}"

      - name: Upload
        if: steps.download.outputs.success == 'true'
        run: |
          rclone move . "mega_bot:${{ github.event.client_payload.folder }}" \
            --include "*.mp4" --include "*.webm" --include "*.mkv"

  notify_batch_done:
    needs: download
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify batch completion
        run: |
          STATUS="${{ needs.download.result }}"
          FOLDER="${{ github.event.client_payload.folder }}"
          COUNT=$(echo '${{ toJSON(github.event.client_payload.urls) }}' | jq 'length')

          if [ "$STATUS" = "success" ]; then
            TEXT="✅ Lot terminé — $COUNT lien(s) traité(s) avec succès dans le dossier \"$FOLDER\"."
          else
            TEXT="⚠️ Lot terminé — $COUNT lien(s) traité(s), au moins un échec dans le dossier \"$FOLDER\" (voir messages précédents pour le détail)."
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ github.event.client_payload.chat_id }}" \
            -d text="$TEXT"