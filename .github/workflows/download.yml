name: Download and Upload

on:
  repository_dispatch:
    types: [new_download]

jobs:
  download:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        url: ${{ fromJSON(toJSON(github.event.client_payload.urls)) }}
      max-parallel: 2
      fail-fast: false

    steps:
      - name: Install tools
        run: |
          python -m pip install -U "yt-dlp[default,curl-cffi]"
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Install deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Configure cookies
        run: |
          echo "${{ secrets.YT_COOKIES }}" > /tmp/youtube-cookies.txt

      - name: Restore archive cache
        uses: actions/cache/restore@v4
        with:
          path: archive.txt
          key: yt-dlp-archive-
          restore-keys: |
            yt-dlp-archive-

      # ============================================================
      # DIAGNOSTIC
      # ============================================================
      - name: Diagnostic URL
        run: |
          URL="${{ matrix.url }}"

          echo "=========================================="
          echo "DIAGNOSTIC URL"
          echo "=========================================="

          echo ""
          echo "--- URL normale ---"
          printf '%s\n' "$URL"

          echo ""
          echo "--- URL shell-escaped ---"
          printf '%q\n' "$URL"

          echo ""
          echo "--- Longueur ---"
          printf '%s' "$URL" | wc -c

          echo ""
          echo "--- Caractères / octets ---"
          printf '%s' "$URL" | od -An -tx1c

          echo ""
          echo "--- Début / fin ---"
          printf 'START=<%s>\n' "${URL:0:30}"
          printf 'END=<%s>\n' "${URL: -30}"

          echo ""
          echo "--- yt-dlp version ---"
          yt-dlp --version

          echo ""
          echo "--- Deno version ---"
          deno --version

          echo ""
          echo "--- curl-cffi ---"
          python -m pip show curl-cffi | grep -E '^(Name|Version):' || true

          echo ""
          echo "--- yt-dlp-ejs ---"
          python -m pip show yt-dlp-ejs | grep -E '^(Name|Version):' || true

          echo ""
          echo "=========================================="
          echo "TEST yt-dlp -F"
          echo "=========================================="

          yt-dlp -v -F \
            --impersonate chrome \
            --js-runtimes deno \
            "$URL"

      # ============================================================
      # DOWNLOAD
      # ============================================================
      - name: Download
        id: download
        run: |
          URL="${{ matrix.url }}"

          touch archive.txt

          COMMON_FLAGS=(
            --js-runtimes deno
            --impersonate chrome
            -f "bestvideo[height<=480]+bestaudio/best"
            --download-archive archive.txt
            --retries 10
            --fragment-retries 10
            -c
            -o "%(title)s.%(ext)s"
          )

          echo "=========================================="
          echo "Tentative 1/3 : sans cookies"
          echo "=========================================="

          if yt-dlp "${COMMON_FLAGS[@]}" "$URL"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "Tentative 2/3 : avec cookies"
          echo "=========================================="

          if yt-dlp \
            --cookies /tmp/youtube-cookies.txt \
            "${COMMON_FLAGS[@]}" \
            "$URL"; then

            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "Tentative 3/3 : diagnostic final"
          echo "=========================================="

          yt-dlp \
            -v \
            -F \
            --impersonate chrome \
            --js-runtimes deno \
            "$URL" 2>&1 | tail -n 100 || true

          echo ""
          echo "Échec des trois tentatives"

          echo "success=false" >> "$GITHUB_OUTPUT"
          exit 1

      # ============================================================
      # SAVE ARCHIVE
      # ============================================================
      - name: Save archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive.txt
          key: yt-dlp-archive-${{ github.run_id }}

      # ============================================================
      # NOTIFICATION FAILURE
      # ============================================================
      - name: Notify failure
        if: steps.download.outputs.success == 'false'
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ github.event.client_payload.chat_id }}" \
            -d text="❌ Échec du téléchargement : ${{ matrix.url }}"

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Create folder if needed
        if: steps.download.outputs.success == 'true'
        run: |
          rclone mkdir \
            "mega_bot:${{ github.event.client_payload.folder }}"

      - name: Upload
        if: steps.download.outputs.success == 'true'
        run: |
          rclone move . \
            "mega_bot:${{ github.event.client_payload.folder }}" \
            --include "*.mp4" \
            --include "*.webm" \
            --include "*.mkv"


  # ================================================================
  # BATCH NOTIFICATION
  # ================================================================
  notify_batch_done:
    needs: download
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify batch completion
        run: |
          STATUS="${{ needs.download.result }}"
          FOLDER="${{ github.event.client_payload.folder }}"
          COUNT=$(echo '${{ toJSON(github.event.client_payload.urls) }}' | jq 'length')

          if [ "$STATUS" = "success" ]; then
            TEXT="✅ Lot terminé — $COUNT lien(s) traité(s) avec succès dans le dossier \"$FOLDER\"."
          else
            TEXT="⚠️ Lot terminé — $COUNT lien(s) traité(s), au moins un échec dans le dossier \"$FOLDER\"."
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ github.event.client_payload.chat_id }}" \
            -d text="$TEXT"