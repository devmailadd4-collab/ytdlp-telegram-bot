name: Cleanup workflow runs
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Current workflow run: $GITHUB_RUN_ID"

          gh run list \
            --limit 1000 \
            --json databaseId,status,name \
            --jq '.[] | select(.status != "in_progress" and .status != "queued") | "\(.databaseId)|\(.status)|\(.name)"' |
          while IFS='|' read -r run_id status name; do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              echo "Skipping current run: $run_id"
              continue
            fi
            echo "Deleting: $run_id | $status | $name"
            gh run delete "$run_id" || true
          done

      - name: Delete old archive caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list \
            --key yt-dlp-archive- \
            --json id \
            --jq '.[].id' |
          while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting cache: $id"
            gh cache delete "$id" || true
          done