name: Cleanup workflow runs
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3

      - name: Delete old archive caches
        run: |
          gh cache list --key yt-dlp-archive- --json id,key -q '.[].id' | \
          while read -r id; do
            gh cache delete "$id"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}